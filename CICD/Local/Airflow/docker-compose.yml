# Airflow orchestrates; it does not compute. Heavy steps run as containerised jobs so the
# scheduler never becomes the bottleneck (PRD A 9.2).
services:
  airflow:
    image: apache/airflow:2.10.2-python3.12
    container_name: akg-airflow
    # standalone also creates the admin user, but with a RANDOM password written inside
    # the container. Setting it here gives the middleware credentials it can hold in
    # config. create-or-reset because the metadata DB lives in Postgres and outlives the
    # container: after the first run the user already exists and create is a no-op.
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password akg-local-only --firstname AKG --lastname Local --role Admin --email admin@akg.local || true;
      airflow users reset-password --username admin --password akg-local-only || true;
      airflow standalone"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Every DAG here is schedule=None -- triggered by the orchestrator, never by a
      # timer -- so unpausing cannot make anything run on its own. Left paused (the
      # default) a triggered run sits in "queued" forever, which reads from the portal as
      # a workflow that started and then hung.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-akg}:${POSTGRES_PASSWORD:-akg-local-only}@akg-postgres:5432/${POSTGRES_DB:-akg}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # The REST API ships with the session backend only, which is for the browser UI:
      # a service calling /api/v1 with basic auth gets 403 no matter what credentials it
      # sends. The middleware triggers DAGs over that API, so basic_auth is required --
      # this was the whole reason Acquire reported airflow_unavailable while /health,
      # which needs no auth at all, answered 200.
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      # Local only. In Azure this comes from Key Vault via the container environment.
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-akg-local-only}
      AKG_ENV: local
      # The name the local-fs endpoint declares. Inside the container the root is the
      # mount point; on the host it is the directory that was mounted.
      AKG_LOCAL_DATA_ROOT: /opt/akg/filesystem
    ports: ["${AIRFLOW_PORT:-8080}:8080"]
    volumes:
      - ../../../DataMgmt/airflow/dags:/opt/airflow/dags:ro
      - ../../../DataMgmt/airflow/plugins:/opt/airflow/plugins:ro
      - akg-airflow-logs:/opt/airflow/logs
      # The local filesystem endpoint, mounted from the host. Without this a download
      # lands inside the container: real bytes, in a directory nobody can see, deleted on
      # the next recreate. The catalog stores a path relative to the endpoint root, and
      # AKG_LOCAL_DATA_ROOT below tells this container where that root is.
      # Distinct name on purpose: this is the HOST directory, while AKG_LOCAL_DATA_ROOT
      # above is the path INSIDE the container. Reusing one name would mean anyone who
      # set it to the container path in .env would silently break the mount.
      - ${AKG_LOCAL_FS_HOST_ROOT:-${HOME}/runtime_data/AKG/Local/FileSystem}:/opt/akg/filesystem
    networks: [akg]

volumes:
  akg-airflow-logs:
networks:
  akg:
    external: true
    name: ${AKG_NETWORK:-akg-net}
