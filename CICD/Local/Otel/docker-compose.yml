# One trace_id from gateway to answer, and the same OTel wire format everywhere: the
# collector's exporter is the only thing that differs between local, Azure Monitor and
# CloudWatch (PRD B 5.3).
# Host ports sit in the 9000 block: 4317 and 4318 are the OTLP defaults and are commonly
# already taken -- on this machine something else held 4317 and the collector could not
# start. Inside the network the containers still speak 4317/4318 to each other.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: akg-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-9317}:4317"
      - "${OTEL_HTTP_PORT:-9318}:4318"
    networks: [akg]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: akg-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    networks: [akg]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: akg-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports: ["${GRAFANA_PORT:-9030}:3000"]
    networks: [akg]

networks:
  akg:
    external: true
    name: ${AKG_NETWORK:-akg-net}
