services:
  redis:
    image: redis:7-alpine
    container_name: akg-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes:
      - akg-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [akg]

volumes:
  akg-redis-data:
networks:
  akg:
    external: true
    name: ${AKG_NETWORK:-akg-net}
