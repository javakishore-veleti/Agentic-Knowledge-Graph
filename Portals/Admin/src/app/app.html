<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="4" r="2.4" fill="currentColor"/>
          <circle cx="4" cy="15" r="2.4" fill="currentColor"/>
          <circle cx="16" cy="15" r="2.4" fill="currentColor"/>
          <path d="M10 6.4 4.8 12.9M10 6.4l5.2 6.5M6.2 15h7.6" stroke="currentColor"
                stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>Knowledge Admin</strong>
        <em>Agentic Knowledge Graph</em>
      </span>
    </div>

    <nav class="topnav" aria-label="Primary">
      @for (item of nav(); track item.path) {
        @if (item.planned) {
          <span class="topnav-link is-planned" [title]="item.label + ' — not built yet'">
            {{ item.label }}
            <span class="planned-dot" aria-label="planned"></span>
          </span>
        } @else {
          <a class="topnav-link" [routerLink]="item.path"
             routerLinkActive="is-active">{{ item.label }}</a>
        }
      }
    </nav>

    <div class="topbar-right">
      @if (usingMock()) {
        <span class="env-badge env-mock"
              title="No backend: data is in-memory and stored per browser. Set useMock to false in src/environments/environment.ts to use the DataCatalog service.">
          mock data
        </span>
      }
      <span class="env-badge" [class.env-local]="env() === 'local'">{{ env() }}</span>
      <span class="tenant">{{ tenant() }}</span>
      <span class="avatar" aria-hidden="true">KV</span>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
