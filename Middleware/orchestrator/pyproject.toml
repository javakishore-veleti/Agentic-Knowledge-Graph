[project]
name = "akg-orchestrator"
version = "0.1.0"
description = "Engine-neutral workflow orchestration. One contract over Airflow, Step Functions, Azure Functions and the rest."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "akg-service-core",
]

[tool.uv.sources]
# Path dependency: the shared layering primitives are not published anywhere.
akg-service-core = { path = "../../Libraries/python/akg-service-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
