[project]
name = "akg-data-mgmt"
version = "0.1.0"
description = "Data management API: acquires datasets from source to destination by triggering Airflow asynchronously"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "akg-service-core",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv.sources]
akg-service-core = { path = "../../Libraries/python/akg-service-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_mgmt"]
